<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ΛV">
<title>ΛV</title>

<!-- PWA manifest (single-file version). A service worker can be added later for full offline installability. -->
<link rel="manifest" href='data:application/manifest+json,{"name":"ΛV Quick Bar","short_name":"ΛV","start_url":".","display":"standalone","background_color":"%23ffffff","theme_color":"%23000000","icons":[]}'>
<style>
  :root{
    --black:#050505;
    --white:#fff;
    --soft:#f4f4f4;
    --line:#dedede;
    --muted:#777;
    --shadow:0 18px 50px rgba(0,0,0,.20);
    --radius:22px;
    --pad:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:transparent}
  body{overflow:hidden}

  /* The actual floating app */
  .launcher{
    position:fixed;
    right:24px;
    bottom:20px;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    pointer-events:none;
  }
  .bar{
    width:fit-content;
    max-width:calc(100vw - 48px);
    min-height:var(--bar-h,60px);
    background:var(--bar-bg,#000);
    color:var(--bar-icon,#fff);
    border-radius:0;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:var(--icon-gap,34px);
    padding:0 8px;
    pointer-events:auto;
    animation:pop .18s ease-out;
  }
  @keyframes pop{
    from{opacity:0;transform:translateY(12px) scale(.97)}
    to{opacity:1;transform:none}
  }

  .bar-scroll{
    flex:0 1 auto;
    min-width:0;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
    display:flex;
    align-items:center;
    height:var(--bar-h,60px);
  }
  .bar-scroll::-webkit-scrollbar{display:none}
  .items{
    display:flex;
    align-items:center;
    gap:var(--icon-gap,34px);
    min-width:max-content;
    padding:0;
  }
  .item{
    width:calc(var(--icon-size,26px) + 2*var(--pad));
    height:calc(var(--bar-h,60px) - 16px);
    border:0;
    background:transparent;
    color:inherit;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:0 0 auto;
    border-radius:14px;
    transition:background .15s,transform .15s;
  }
  .item:hover{background:color-mix(in srgb,currentColor 16%,transparent);transform:translateY(-1px)}
  .item svg{width:var(--icon-size,34px);height:var(--icon-size,34px);stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .item .filled{fill:currentColor;stroke:currentColor}

  .dots{
    height:calc(var(--bar-h,60px) - 16px);
    flex:0 0 auto;
    border:0;background:transparent;color:inherit;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;border-radius:14px;padding:0;
  }
  .dots:hover{background:color-mix(in srgb,currentColor 16%,transparent)}
  .dots{width:calc(4px + 2*var(--pad))}
  .dots svg{width:4px;height:16px;fill:currentColor;stroke:none}
  svg .filled{fill:currentColor}

  .collapsed{
    width:56px;height:56px;
    border-radius:50%;
    background:var(--bar-bg,#000);color:var(--bar-icon,#fff);
    border:0;box-shadow:var(--shadow);
    pointer-events:auto;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    animation:pop .18s ease-out;
  }
  .logo{
    font-family:Arial,Helvetica,sans-serif;
    font-size:20px;
    font-weight:400;
    letter-spacing:-2px;
    line-height:1;
  }

  /* Settings */
  .backdrop{
    position:fixed;inset:0;z-index:2000;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(6px);
    display:none;
    align-items:flex-end;
    justify-content:flex-end;
    padding:22px;
  }
  .backdrop.open{display:flex}
  .settings{
    width:min(440px,calc(100vw - 30px));
    max-height:min(760px,calc(100vh - 44px));
    background:#000;color:#fff;
    border:1px solid #242424;border-radius:0;
    box-shadow:0 30px 90px rgba(0,0,0,.6);
    overflow:hidden;
    display:flex;flex-direction:column;
    color-scheme:dark;
  }
  .settings-head{
    padding:26px 28px 22px;
    border-bottom:1px solid #1f1f1f;
    display:flex;align-items:flex-start;justify-content:space-between;
  }
  .settings-head h2{margin:0;font-size:11px;letter-spacing:.28em;font-weight:700}
  .settings-head p{margin:8px 0 0;color:#6b6b6b;font-size:8px;letter-spacing:.22em;font-weight:400}
  .x{
    width:28px;height:28px;border:0;background:transparent;color:#fff;cursor:pointer;
    display:grid;place-items:center;margin:-4px -6px 0 0;
  }
  .x svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .x:hover{background:#151515}
  .settings-body{padding:4px 28px 30px;overflow:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
  .section-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:8px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:#6b6b6b;
    margin:30px 0 8px;
  }
  .link-list{display:flex;flex-direction:column;margin-bottom:18px}
  .link-row{
    display:flex;align-items:center;gap:16px;
    padding:14px 0;border-bottom:1px solid #1a1a1a;
  }
  .link-icon{
    width:36px;height:36px;border:1px solid #2a2a2a;color:#fff;
    display:grid;place-items:center;flex:0 0 auto;
  }
  .link-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .link-info{min-width:0;flex:1}
  .link-name{font-weight:700;font-size:10px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link-url{font-size:8px;letter-spacing:.06em;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
  .row-actions{display:flex;gap:2px}
  .small-btn{
    width:28px;height:28px;border:0;background:transparent;color:#7a7a7a;cursor:pointer;
    display:grid;place-items:center;
  }
  .small-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .small-btn:hover{background:#151515;color:#fff}
  .add{
    width:100%;height:42px;border:1px solid #fff;background:transparent;color:#fff;
    font-weight:700;cursor:pointer;font-size:9px;letter-spacing:.26em;text-transform:uppercase;
    transition:background .15s,color .15s;
  }
  .add:hover{background:#fff;color:#000}
  .add:disabled{border-color:#2a2a2a;color:#555;background:transparent;cursor:not-allowed}

  .control-row{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;padding:20px 0;border-bottom:1px solid #1a1a1a;
  }
  .control-row strong{display:block;font-size:9px;letter-spacing:.22em;font-weight:700}
  .control-row span{display:block;color:#666;font-size:8px;margin-top:7px;letter-spacing:.14em;text-transform:uppercase}
  .color-wrap{width:30px;height:30px;border:1px solid #333;padding:3px;flex:0 0 auto}
  .color-wrap input{-webkit-appearance:none;appearance:none;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:pointer;display:block}
  .color-wrap input::-webkit-color-swatch-wrapper{padding:0}
  .color-wrap input::-webkit-color-swatch{border:0}
  .color-wrap input::-moz-color-swatch{border:0}
  .range-wrap{display:flex;align-items:center;gap:14px;justify-content:flex-end}
  .range-wrap input{-webkit-appearance:none;appearance:none;width:120px;height:16px;background:transparent;outline:none;cursor:pointer;margin:0}
  .range-wrap input::-webkit-slider-runnable-track{height:1px;background:#444}
  .range-wrap input::-moz-range-track{height:1px;background:#444}
  .range-wrap input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:0;margin-top:-6px}
  .range-wrap input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
  .range-wrap b{font-size:9px;letter-spacing:.1em;width:22px;text-align:right;font-weight:700}
  .minimal-select{
    height:30px;border:1px solid #333;border-radius:0;background:#000;color:#fff;
    padding:0 10px;font-size:9px;font-weight:700;letter-spacing:.2em;cursor:pointer;outline:none;
  }
  .minimal-select:hover,.minimal-select:focus{border-color:#fff}

  /* Editor */
  .editor{
    position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.6);
    backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px;
  }
  .editor.open{display:flex}
  .editor-card{
    width:min(480px,100%);max-height:calc(100vh - 40px);overflow:auto;
    background:#000;color:#fff;border:1px solid #242424;border-radius:0;
    box-shadow:0 30px 90px rgba(0,0,0,.6);
    padding:28px;color-scheme:dark;
  }
  .editor-card h3{margin:0;font-size:11px;letter-spacing:.28em;font-weight:700;text-transform:uppercase}
  label{display:block;font-size:8px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#6b6b6b;margin:26px 0 4px}
  input[type=text],input[type=url]{
    width:100%;height:40px;border:0;border-bottom:1px solid #2a2a2a;border-radius:0;
    background:transparent;color:#fff;padding:0;font-size:12px;letter-spacing:.06em;outline:none;
  }
  input[type=text]::placeholder,input[type=url]::placeholder{color:#555;font-size:9px;letter-spacing:.16em;text-transform:uppercase}
  input[type=text]:focus,input[type=url]:focus{border-bottom-color:#fff}
  .icon-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;
    height:232px;overflow:auto;margin-top:16px;padding-right:4px;
    scrollbar-width:thin;scrollbar-color:#333 transparent;align-content:start;
  }
  .icon-group{grid-column:1/-1;font-size:8px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#6b6b6b;margin:12px 0 2px}
  .icon-group:first-child{margin-top:0}
  .icon-choice{
    height:42px;border:1px solid #222;border-radius:0;background:transparent;color:#fff;
    display:grid;place-items:center;cursor:pointer;
  }
  .icon-choice:hover{border-color:#777}
  .icon-choice.selected{background:#fff;color:#000;border-color:#fff}
  .icon-choice svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon-empty{grid-column:1/-1;padding:40px 0;text-align:center;font-size:9px;letter-spacing:.2em;color:#666;text-transform:uppercase}
  .editor-actions{display:flex;gap:10px;margin-top:26px}
  .editor-actions button{
    flex:1;height:42px;border:1px solid #fff;border-radius:0;cursor:pointer;
    font-size:9px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  }
  .editor-actions .cancel{background:transparent;color:#fff;border-color:#333}
  .editor-actions .cancel:hover{border-color:#fff}
  .editor-actions .save{background:#fff;color:#000}
  .editor-actions .save:hover{background:#ddd}

    @media(max-width:600px){
    .launcher{right:10px;bottom:10px}
    .bar{max-width:calc(100vw - 20px)}
    .bar,.items{gap:min(var(--icon-gap,34px),14px)}
    .backdrop{padding:10px}
    .settings{width:100%;max-height:90vh}
  }
</style>
</head>
<body>

<div class="launcher" id="launcher">
  <button class="collapsed" id="collapsed" aria-label="Open ΛV quick bar" style="display:none">
    <span class="logo">ΛV</span>
  </button>

  <div class="bar" id="bar">
    <button class="dots" id="settingsBtn" aria-label="Settings" title="Settings">
      <svg viewBox="9.6 2 4.8 20"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>
    </button>

    <div class="bar-scroll" id="barScroll">
      <div class="items" id="items"></div>
    </div>

  </div>
</div>

<div class="backdrop" id="settingsModal">
  <div class="settings">
    <div class="settings-head">
      <div>
        <h2>SETTINGS</h2>
        <p>SHORTCUTS · APPEARANCE</p>
      </div>
      <button class="x" id="settingsClose" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="settings-body">
      <div class="section-head" style="margin-top:24px"><span>Shortcuts</span><span id="limitNote"></span></div>
      <div class="link-list" id="linkList"></div>
      <button class="add" id="addBtn">+ Add shortcut</button>

      <div class="section-head"><span>Appearance</span></div>

      <div class="control-row">
        <div><strong>BACKGROUND</strong><span>Bar colour</span></div>
        <div class="color-wrap"><input id="bgColor" type="color" value="#000000"></div>
      </div>

      <div class="control-row">
        <div><strong>ICON COLOUR</strong><span>Shortcut icons</span></div>
        <div class="color-wrap"><input id="iconColor" type="color" value="#ffffff"></div>
      </div>

      <div class="control-row">
        <div><strong>BAR HEIGHT</strong><span>Thinner · taller</span></div>
        <div class="range-wrap"><input id="barHeight" type="range" min="44" max="100" value="60"><b id="barHeightValue">60</b></div>
      </div>

      <div class="control-row">
        <div><strong>ICON SIZE</strong><span>Smaller · larger</span></div>
        <div class="range-wrap"><input id="iconSize" type="range" min="16" max="44" value="26"><b id="iconSizeValue">26</b></div>
      </div>

      <div class="control-row">
        <div><strong>SPACING</strong><span>Gap between icons</span></div>
        <div class="range-wrap"><input id="spacing" type="range" min="8" max="64" value="34"><b id="spacingValue">34</b></div>
      </div>
    </div>
  </div>
</div>

<div class="editor" id="editor">
  <div class="editor-card">
    <h3 id="editorTitle">Add shortcut</h3>

    <label for="name">Name</label>
    <input id="name" type="text" placeholder="e.g. Maths" maxlength="40" autocomplete="off">

    <label for="url">Link</label>
    <input id="url" type="url" placeholder="https://example.com">

    <label for="iconSearch">Icon</label>
    <input id="iconSearch" type="text" placeholder="Search — maths, calendar, science…" autocomplete="off">
    <div class="icon-grid" id="iconGrid"></div>

    <div class="editor-actions">
      <button class="cancel" id="cancelEdit">Cancel</button>
      <button class="save" id="saveEdit">Save</button>
    </div>
  </div>
</div>

    smile:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14c1 1.8 5.5 1.8 7 0M9 9.5h.01M15 9.5h.01"/></svg>`,

    smartphone:`<svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>`,
    wrench:`<svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9l-3.8 3.8Z"/></svg>`,

    gem:`<svg viewBox="0 0 24 24"><path d="M6 4h12l3 5-9 12L3 9l3-5Z"/><path d="M3 9h18M9 4 7 9l5 12 5-12-2-5"/></svg>`,
    crown:`<svg viewBox="0 0 24 24"><path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8Z"/></svg>`,
    tree:`<svg viewBox="0 0 24 24"><path d="M12 21v-7M12 14c-4 0-6-3-6-6 0-3 3-5 6-5s6 2 6 5c0 3-2 6-6 6Z"/></svg>`,
    sliders:`<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>`,
    branch:`<svg viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-4 5-8 6.5-2 .8-4 .5-4 .5"/></svg>`
  });

  const KEYWORDS = {
    calendar:'date day schedule planner diary month',
    'calendar-check':'done attendance booked confirmed tick',
    'calendar-plus':'add new event book',
    'calendar-minus':'remove cancel',
    'calendar-x':'cancelled missed absent',
    'calendar-days':'month week planner dates',
    'calendar-today':'today date now',
    'calendar-range':'week term holiday period dates between',
    'calendar-alert':'deadline due important urgent',
    'calendar-clock':'schedule appointment lesson time booking',
    timetable:'lessons classes schedule week grid periods',
    clock:'time hour watch',
    timer:'stopwatch countdown revision pomodoro',
    hourglass:'time wait deadline',
    maths:'math mathematics algebra numbers plus minus times divide arithmetic',
    pi:'maths math circle trigonometry',
    sigma:'maths statistics sum algebra function',
    geometry:'maths triangle angle shapes set square',
    infinity:'maths calculus limit',
    calculator:'maths math numbers sums',
    science:'chemistry lab flask experiment beaker',
    atom:'physics chemistry science particle',
    leaf:'biology nature plant environment eco',
    droplet:'water chemistry rain liquid',
    flame:'fire chemistry hot streak',
    brain:'psychology mind think biology neuroscience',
    activity:'health pe heartbeat pulse biology fitness',
    pill:'medicine health biology pharmacy',
    history:'museum ancient classics landmark social studies columns',
    compass:'geography navigate direction explore',
    mountain:'geography outdoors hiking landscape',
    globe:'geography world earth languages internet web',
    map:'geography atlas location',
    english:'literature writing letters language essay a',
    'book-open':'reading literature english library novel',
    book:'reading literature textbook library',
    languages:'french spanish german translate foreign mfl latin',
    art:'painting design palette drawing creative',
    music:'band choir instrument song note',
    headphones:'music listening audio podcast',
    drama:'theatre theater acting mask performing arts comedy',
    dumbbell:'pe gym fitness sport training weights',
    basketball:'pe sport ball games team',
    trophy:'sport win competition prize cup',
    computing:'computer science ict monitor screen desktop',
    laptop:'computer ict coding work',
    chip:'computer science electronics technology processor',
    code:'computing programming developer',
    terminal:'computing coding command console',
    law:'justice legal civics politics scales government',
    economics:'business pie chart finance statistics',
    trend:'business growth graph stats up',
    dollar:'money business economics finance cash',
    presentation:'project slides talk teaching board',
    graduation:'university college degree study exam school',
    school:'building education class college',
    backpack:'school bag student',
    notebook:'notes book jotter exercise',
    ruler:'measure design technology geometry',
    exam:'test quiz assessment checklist paper',
    tasks:'todo homework checklist to-do',
    award:'medal prize badge achievement',
    newspaper:'news article media current affairs',
    paper:'document essay homework worksheet file',
    chart:'graph data stats analytics',
    mail:'email message inbox',
    message:'chat comment text',
    home:'house start main',
    star:'favourite favorite rating',
    heart:'love like favourite',
    bell:'notification alert reminder',
    lock:'security private password',
    settings:'gear cog preferences options',
    sliders:'settings controls adjust preferences',
    smile:'happy emoji face wellbeing mood',
    gamepad:'games gaming play fun',
    utensils:'food lunch canteen cafeteria dinner restaurant eat',
    wallet:'money payment cash finance',
    smartphone:'phone mobile app',
    wrench:'tools repair design technology fix',
    umbrella:'weather rain',
    gem:'diamond jewel premium',
    crown:'king queen top winner',
    tree:'nature environment forest geography',
    branch:'git code version fork',
    megaphone:'announcements news speaker',
    target:'goals aim focus',
    users:'people team group class friends',
    user:'person profile account',
    coffee:'break cafe drink tea',
    lightbulb:'idea tip learn think',
    rocket:'launch start space',
    camera:'photo photography',
    video:'film movie lesson recording',
    cloud:'storage weather online drive',
    folder:'files documents drive',
    clipboard:'notes list paste',
    pin:'location save keep',
    qr:'scan code',
    cart:'shop store buy',
    sun:'weather day light brightness',
    moon:'night dark sleep'
  };

  const GROUP_DEFS = [
    {title:'Calendar & time', keys:['calendar','calendar-check','calendar-plus','calendar-minus','calendar-x','calendar-clock','calendar-days','calendar-today','calendar-range','calendar-alert','timetable','clock','timer','hourglass']},
    {title:'Subjects', keys:['maths','pi','sigma','geometry','infinity','calculator','science','atom','leaf','droplet','flame','brain','activity','pill','history','compass','mountain','globe','map','english','book-open','book','languages','art','music','headphones','drama','dumbbell','basketball','trophy','computing','laptop','chip','code','terminal','law','economics','trend','dollar','presentation']},
    {title:'Study & school', keys:['graduation','school','backpack','notebook','ruler','exam','tasks','award','newspaper','paper','clipboard','bookmark','lightbulb','target']}
  ];
  const usedKeys = new Set(GROUP_DEFS.flatMap(g => g.keys));
  const GROUPS = GROUP_DEFS.map(g => ({title:g.title, keys:g.keys.filter(k => ICONS[k])}));
  GROUPS.push({title:'General', keys:Object.keys(ICONS).filter(k => !usedKeys.has(k))});
  const STORAGE = 'lv_quickbar_shortcuts_v1';
  const MAX_LINKS = 7;
  const APPEARANCE_STORAGE = 'lv_quickbar_appearance_v1';

  const defaultLinks = [
    {name:'Announcements', url:'#', icon:'megaphone'},
    {name:'Messages', url:'#', icon:'mail'},
    {name:'Analytics', url:'#', icon:'chart'},
    {name:'Goals', url:'#', icon:'target'}
  ];

  let links = (JSON.parse(localStorage.getItem(STORAGE) || 'null') || defaultLinks).slice(0, MAX_LINKS);
  let appearance = Object.assign(
    {bg:'#000000', icon:'#ffffff', spacing:34, size:26, height:60},
    JSON.parse(localStorage.getItem(APPEARANCE_STORAGE) || 'null') || {}
  );
  // older saves stored size as small / medium / large
  if(typeof appearance.size === 'string') appearance.size = ({small:20, medium:26, large:32})[appearance.size] || 26;
  let editingIndex = null;
  let selectedIcon = 'link';

  const $ = id => document.getElementById(id);
  const items = $('items');
  const bar = $('bar');
  const collapsed = $('collapsed');
  const settingsModal = $('settingsModal');
  const editor = $('editor');

  function saveState(){
    localStorage.setItem(STORAGE, JSON.stringify(links));
    localStorage.setItem(APPEARANCE_STORAGE, JSON.stringify(appearance));
  }

  function applyAppearance(){
    // icons can never be bigger than the bar can hold
    const iconPx = Math.min(appearance.size, appearance.height - 14);
    document.documentElement.style.setProperty('--bar-h', appearance.height + 'px');
    document.documentElement.style.setProperty('--icon-gap', appearance.spacing + 'px');
    document.documentElement.style.setProperty('--icon-size', iconPx + 'px');
    document.documentElement.style.setProperty('--bar-bg', appearance.bg);
    document.documentElement.style.setProperty('--bar-icon', appearance.icon);
    bar.style.background = appearance.bg;
    bar.style.color = appearance.icon;
    collapsed.style.background = appearance.bg;
    collapsed.style.color = appearance.icon;
  }

  function renderBar(){
    items.innerHTML = '';
    links.forEach((item,index)=>{
      const b = document.createElement('button');
      b.className = 'item';
      b.title = item.name;
      b.setAttribute('aria-label', item.name);
      b.innerHTML = ICONS[item.icon] || ICONS.link;
      b.addEventListener('click', ()=>{
        if(!item.url || item.url === '#') return;
        let url = item.url.trim();
        if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
        window.open(url, '_blank', 'noopener,noreferrer');
      });
      items.appendChild(b);
    });
  }

  function renderSettings(){
    $('linkList').innerHTML = '';
    links.forEach((item,index)=>{
      const row = document.createElement('div');
      row.className = 'link-row';
      row.innerHTML = `
        <div class="link-icon">${ICONS[item.icon] || ICONS.link}</div>
        <div class="link-info">
          <div class="link-name">${escapeHtml(item.name)}</div>
          <div class="link-url">${escapeHtml(item.url)}</div>
        </div>
        <div class="row-actions">
          <button class="small-btn" title="Edit">${ICONS.edit}</button>
          <button class="small-btn" title="Delete">${ICONS.x}</button>
        </div>`;
      row.querySelectorAll('.small-btn')[0].onclick = ()=>openEditor(index);
      row.querySelectorAll('.small-btn')[1].onclick = ()=>{
        if(confirm('Delete "' + item.name + '"?')){
          links.splice(index,1); saveState(); renderBar(); renderSettings();
        }
      };
      $('linkList').appendChild(row);
    });
    const full = links.length >= MAX_LINKS;
    $('addBtn').disabled = full;
    $('addBtn').textContent = full ? 'Maximum reached' : '+ Add shortcut';
    $('limitNote').textContent = links.length + ' / ' + MAX_LINKS;
    $('bgColor').value = appearance.bg;
    $('iconColor').value = appearance.icon;
    $('spacing').value = appearance.spacing;
    $('spacingValue').textContent = appearance.spacing;
    $('iconSize').value = appearance.size;
    $('iconSizeValue').textContent = appearance.size;
    $('barHeight').value = appearance.height;
    $('barHeightValue').textContent = appearance.height;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function openSettings(){
    renderSettings();
    settingsModal.classList.add('open');
  }
  function closeSettings(){settingsModal.classList.remove('open')}

  function buildIconPicker(){
    const grid = $('iconGrid');
    const q = ($('iconSearch').value || '').trim().toLowerCase();
    const terms = q ? q.split(/\s+/) : [];
    grid.innerHTML = '';
    let shown = 0;
    GROUPS.forEach(g=>{
      const keys = g.keys.filter(k=>{
        const hay = k.replace(/-/g,' ') + ' ' + (KEYWORDS[k] || '') + ' ' + g.title.toLowerCase();
        return terms.every(t => hay.includes(t));
      });
      if(!keys.length) return;
      const h = document.createElement('div');
      h.className = 'icon-group';
      h.textContent = g.title;
      grid.appendChild(h);
      keys.forEach(key=>{
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'icon-choice' + (key===selectedIcon?' selected':'');
        b.innerHTML = ICONS[key];
        b.title = key.replace(/-/g,' ');
        b.onclick = ()=>{
          selectedIcon = key;
          grid.querySelectorAll('.icon-choice').forEach(x=>x.classList.remove('selected'));
          b.classList.add('selected');
        };
        grid.appendChild(b);
      });
      shown += keys.length;
    });
    if(!shown){
      const e = document.createElement('div');
      e.className = 'icon-empty';
      e.textContent = 'No icons match "' + q + '"';
      grid.appendChild(e);
    }
  }

    function openEditor(index=null){
    editingIndex = index;
    if(index === null){
      $('editorTitle').textContent='Add shortcut';
      $('name').value='';
      $('url').value='';
      selectedIcon='link';
    }else{
      $('editorTitle').textContent='Edit shortcut';
      $('name').value=links[index].name;
      $('url').value=links[index].url;
      selectedIcon=links[index].icon || 'link';
    }
    $('iconSearch').value = '';
    buildIconPicker();
    editor.classList.add('open');
    const sel = $('iconGrid').querySelector('.selected');
    if(sel) sel.scrollIntoView({block:'nearest'});
    setTimeout(()=>$('name').focus(),50);
  }

  function closeEditor(){editor.classList.remove('open')}

  $('saveEdit').onclick = ()=>{
    const name=$('name').value.trim();
    let url=$('url').value.trim();
    if(!name){alert('Please give the shortcut a name.');return}
    if(!url){alert('Please add a link.');return}
    if(!/^https?:\/\//i.test(url)) url='https://'+url;
    const obj={name,url,icon:selectedIcon};
    if(editingIndex===null){
      if(links.length>=MAX_LINKS){closeEditor();return}
      links.push(obj);
    }else{
      links[editingIndex]=obj;
    }
    saveState(); renderBar(); renderSettings(); closeEditor();
  };

  $('addBtn').onclick=()=>{
    if(links.length>=MAX_LINKS) return;
    openEditor();
  };

  $('iconSearch').addEventListener('input', buildIconPicker);
  $('cancelEdit').onclick=closeEditor;
  $('settingsBtn').onclick=openSettings;
  $('settingsClose').onclick=closeSettings;

  $('bgColor').oninput=e=>{
    appearance.bg=e.target.value; saveState(); applyAppearance();
  };
  $('iconColor').oninput=e=>{
    appearance.icon=e.target.value; saveState(); applyAppearance();
  };
  $('spacing').oninput=e=>{
    appearance.spacing=Number(e.target.value);
    $('spacingValue').textContent=e.target.value;
    saveState(); applyAppearance();
  };
  $('iconSize').oninput=e=>{
    appearance.size=Number(e.target.value);
    $('iconSizeValue').textContent=e.target.value;
    saveState(); applyAppearance();
  };
  $('barHeight').oninput=e=>{
    appearance.height=Number(e.target.value);
    $('barHeightValue').textContent=e.target.value;
    saveState(); applyAppearance();
  };

  settingsModal.addEventListener('click',e=>{if(e.target===settingsModal)closeSettings()});
  editor.addEventListener('click',e=>{if(e.target===editor)closeEditor()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(editor.classList.contains('open')) closeEditor();
      else if(settingsModal.classList.contains('open')) closeSettings();
    }
  });

  renderBar();
  applyAppearance();
})();
</script>
</body>
